name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py collaboration.py maintenance.py scripts/prepare_release.py
      - run: python scripts/prepare_release.py

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node --check public/shared.js
      - run: node --check public/features.js
      - run: node --check public/client.js

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker build -t together-workspace:ci .
